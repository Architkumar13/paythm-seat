services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: seat
      POSTGRES_PASSWORD: seat
      POSTGRES_DB: seats
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seat -d seats"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    environment:
      DATABASE_URL: postgres://seat:seat@db:5432/seats?sslmode=disable
      ADMIN_TOKEN: dev-admin-token
      JWT_SECRET: dev-jwt-secret-change-me-32b
      PORT: "8080"
      DB_MAX_CONNS: "20"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
